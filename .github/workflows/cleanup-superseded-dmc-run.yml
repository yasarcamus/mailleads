name: Cleanup Superseded DMC Crawl

on:
  push:
    paths:
      - "runs/domain-email/dmc-antalya-2026-07-26/**"

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor == 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Remove superseded DMC crawl output') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove superseded output
        run: rm -rf "runs/domain-email/dmc-antalya-2026-07-26"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "runs/domain-email/dmc-antalya-2026-07-26" || true
          if git diff --cached --quiet; then
            echo "No superseded output to remove."
          else
            git commit -m "Remove superseded DMC crawl output"
            git push
          fi
