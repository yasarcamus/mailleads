name: TouristNetTR DMC Domain Email Crawl

on:
  push:
    paths:
      - "triggers/domain-email-dmc-clean/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: touristnettr-dmc-domain-email-crawl
  cancel-in-progress: false

jobs:
  crawl-dmc-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate input
        run: |
          test -s seeds/touristnettr_dmc_domains_clean_2026-07-26.csv
          python - <<'PY'
          import csv
          p = 'seeds/touristnettr_dmc_domains_clean_2026-07-26.csv'
          with open(p, encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          assert rows, 'Seed file has no rows'
          assert 'domain' in rows[0], 'Seed file is missing domain column'
          print(f'Validated {len(rows)} domain rows')
          PY

      - name: Crawl DMC domains
        run: |
          python scripts/domain_email_extractor.py \
            --input "seeds/touristnettr_dmc_domains_clean_2026-07-26.csv" \
            --run-dir "runs/domain-email/dmc-antalya-clean-2026-07-26" \
            --max-pages-per-site 6 \
            --timeout 12 \
            --stop-after 0 \
            --max-runtime-seconds 19800 \
            --sleep-seconds 0.3

      - name: Commit outputs with retry
        if: always()
        run: |
          OUT="runs/domain-email/dmc-antalya-clean-2026-07-26"
          test -d "$OUT" || { echo "Output directory was not created"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Add clean DMC domain crawl results"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Output pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not push output after retries."
          exit 1

      - name: Upload crawler artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touristnettr-dmc-domain-email-output-clean
          path: |
            runs/domain-email/dmc-antalya-clean-2026-07-26/all_results.csv
            runs/domain-email/dmc-antalya-clean-2026-07-26/emails_found.csv
            runs/domain-email/dmc-antalya-clean-2026-07-26/checkpoint.json
          if-no-files-found: error
